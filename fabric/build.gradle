architectury {
    platformSetupLoomIde()
    fabric()
}

dependencies {
    api "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Optional: Mod Menu + Cloth Config (for in-game settings GUI)
    compileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}")
    localRuntime("com.terraformersmc:modmenu:${rootProject.modmenu_version}")
    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    common(project(path: ':')) { transitive false }
    shadowBundle project(path: ':', configuration: 'transformProductionFabric')

}
