site_name: Civillis Wiki
site_url: https://maoxnz.github.io/Civillis/
site_description: Documentation for the Civillis Minecraft mod
repo_url: https://github.com/MaoxnZ/Civillis
repo_name: MaoxnZ/Civillis

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Play:
    - Getting started: play/getting-started.md
    - Civilization model:
        - How It Works: how-it-works.md
        - Blocks & Scoring: blocks-and-scoring.md
        - Civilization Decay: civilization-decay.md
    - Spawn and mobs:
        - Monster Heads: monster-heads.md
        - Mob Flee AI: mob-flee-ai.md
    - Survival and structures:
        - Podium of Undying: play/podium-of-undying.md
    - Visualization:
        - Zone transition HUD: play/zone-transition-hud.md
        - Civilization Sonar: sonar/index.md
    - World rules:
        - Structure spawn rules: play/structure-spawn-rules.md
        - Dimension rules: play/dimension-rules.md
    - Operators:
        - Commands: play/commands.md
    - Glossary: glossary.md
  - Customize:
    - Configuration: configuration.md
    - Data-Driven Registries: modpack/data-driven.md
    - Built-in Compatibility: modpack/compatibility.md
  - Internals:
    - Architecture Overview: technical/architecture.md
    - Performance: technical/performance.md
  - Future plans: future-plans.md

extra:
  nav_sidebar_title: Navigation

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
